    min-height:100%;
  }
  .wrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));}

  .eyebrow{font-family:var(--mono);font-size:0.68rem;letter-spacing:0.16em;color:var(--ink-faint);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .eyebrow .refresh-btn{background:none;border:none;color:var(--ink-faint);font-family:var(--mono);font-size:0.68rem;letter-spacing:0.1em;cursor:pointer;padding:4px;}
  .eyebrow .refresh-btn:hover, .eyebrow .refresh-btn:focus-visible{color:var(--amber);outline:none;}

  .readout{border:1px solid var(--grid);border-radius:4px;background:var(--panel);padding:14px 16px;box-shadow:0 1px 3px rgba(34,48,63,0.07);}
  .coords{font-family:var(--mono);font-size:1.15rem;letter-spacing:0.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .coords .val{color:var(--ink);}
  .coords .val .unit{color:var(--ink-faint);font-size:0.85em;}
  .accuracy-badge{font-family:var(--mono);font-size:0.7rem;color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:2px 9px;white-space:nowrap;}
  .place-row{display:flex;justify-content:space-between;align-items:baseline;font-size:0.82rem;color:var(--ink-dim);margin-top:8px;flex-wrap:wrap;gap:4px;}
  .place-row .updated{font-family:var(--mono);font-size:0.72rem;color:var(--ink-faint);}

  .state-box{text-align:center;padding:64px 12px;}
  .locating-anim{width:72px;height:72px;position:relative;margin:0 auto 20px;}
  .locating-anim .ring{position:absolute;inset:0;border:1px solid var(--teal);border-radius:50%;animation:pulse 2s ease-out infinite;opacity:0;}
  .locating-anim .ring.r2{animation-delay:0.7s;}
  .locating-anim .dot{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;background:var(--amber);border-radius:50%;}
  @keyframes pulse{0%{transform:scale(0.25);opacity:0.9;}100%{transform:scale(1);opacity:0;}}
  @media (prefers-reduced-motion:reduce){.locating-anim .ring{animation:none;opacity:0.35;}}
  .state-box p{font-family:var(--mono);font-size:0.85rem;color:var(--ink-dim);}

  .error-box{border:1px solid var(--coral);border-radius:4px;padding:16px;background:var(--panel);}
  .error-box p{font-size:0.88rem;color:var(--ink);margin-bottom:12px;}
  .btn{font-family:var(--mono);background:none;border:1px solid var(--grid);color:var(--ink-dim);padding:9px 16px;border-radius:3px;font-size:0.78rem;cursor:pointer;letter-spacing:0.03em;}
  .btn:hover,.btn:focus-visible{border-color:var(--amber);color:var(--amber);outline:none;}
  .btn:focus-visible{box-shadow:0 0 0 2px rgba(217,162,83,0.3);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .manual-form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .manual-form input{font-family:var(--mono);background:var(--bg);border:1px solid var(--grid);color:var(--ink);padding:8px 10px;border-radius:3px;width:130px;font-size:0.83rem;}
  .manual-form input:focus-visible{outline:none;border-color:var(--amber);}
  .manual-toggle{background:none;border:none;color:var(--ink-faint);font-family:var(--mono);font-size:0.72rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:12px;}
  .manual-toggle:hover,.manual-toggle:focus-visible{color:var(--teal);outline:none;}

  .current{text-align:center;padding:30px 0 18px;}
  .current .icon{width:54px;height:54px;margin:0 auto 2px;color:var(--ink-dim);}
  .current .temp{font-family:var(--mono);font-size:4.4rem;font-weight:600;color:var(--amber);line-height:1;}
  .current .temp .unit{font-size:1.7rem;font-weight:400;color:var(--ink-dim);margin-left:2px;}
  .current .desc{font-size:1.05rem;margin-top:6px;color:var(--ink);}
  .stats-row{display:flex;margin-top:20px;border-top:1px solid var(--grid);padding-top:14px;}
  .stat{flex:1;text-align:center;padding:0 6px;position:relative;}
  .stat:not(:last-child)::after{content:'';position:absolute;right:0;top:12%;bottom:12%;width:1px;background:var(--grid);}
  .stat .label{font-size:0.66rem;color:var(--ink-faint);letter-spacing:0.06em;text-transform:uppercase;}
  .stat .value{font-family:var(--mono);font-size:0.98rem;color:var(--ink);margin-top:5px;}

  .section-title{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.14em;color:var(--ink-faint);text-transform:uppercase;margin:30px 0 10px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--grid);}

  .trace-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--grid);border-radius:4px;background:var(--panel);box-shadow:0 1px 3px rgba(34,48,63,0.07);}
  .trace-scroll svg{display:block;}
  .trace-legend{display:flex;gap:16px;margin-top:8px;font-size:0.72rem;color:var(--ink-faint);font-family:var(--mono);}
  .trace-legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .day-log{border:1px solid var(--grid);border-radius:4px;background:var(--panel);padding:2px 14px;box-shadow:0 1px 3px rgba(34,48,63,0.07);}
  .day-row{display:grid;grid-template-columns:56px 26px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--grid);}
  .day-row:last-child{border-bottom:none;}
  .day-row .date{font-family:var(--mono);font-size:0.82rem;color:var(--ink-dim);}
  .day-row .icon{width:22px;height:22px;color:var(--ink-dim);}
  .day-row .desc{font-size:0.82rem;color:var(--ink);}
  .day-row .pop{font-family:var(--mono);font-size:0.72rem;color:var(--teal);display:block;margin-top:2px;}
  .day-row .temps{font-family:var(--mono);font-size:0.9rem;text-align:right;white-space:nowrap;}
  .day-row .temps .hi{color:var(--amber);}
  .day-row .temps .lo{color:var(--ink-faint);margin-left:6px;}

  footer{margin-top:34px;text-align:center;}
  footer p{font-size:0.7rem;color:var(--ink-faint);font-family:var(--mono);margin-bottom:12px;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">
    <span>PINPOINT FORECAST / 現在地精密予報</span>
    <button class="refresh-btn hidden" id="relocateBtn" type="button">[ 現在地を再取得 ]</button>
  </div>

  <div class="readout hidden" id="readoutBox">
    <div class="coords">
      <span class="val" id="latVal">--</span>
      <span class="val" id="lonVal">--</span>
      <span class="accuracy-badge" id="accuracyBadge">±--m</span>
    </div>
    <div class="place-row">
      <span id="placeName">位置を特定中…</span>
      <span class="updated" id="updatedAt"></span>
    </div>
  </div>

  <!-- Locating state -->
  <div class="state-box" id="locatingState">
    <div class="locating-anim"><div class="ring"></div><div class="ring r2"></div><div class="dot"></div></div>
    <p>現在地を測位中…</p>
  </div>

  <!-- Location error state -->
  <div class="error-box hidden" id="locationErrorState">
    <p id="locationErrorMsg"></p>
    <div class="btn-row">
      <button class="btn" id="retryLocationBtn" type="button">[ 再試行 ]</button>
    </div>
    <button class="manual-toggle" id="manualToggleBtn" type="button">座標を手動で入力する</button>
    <div class="manual-form hidden" id="manualForm">
      <input type="number" step="any" id="manualLat" placeholder="緯度 例) 35.6895">
      <input type="number" step="any" id="manualLon" placeholder="経度 例) 139.6917">
      <button class="btn" id="manualSubmitBtn" type="button">[ 設定 ]</button>
    </div>
  </div>

  <!-- Weather fetch error -->
  <div class="error-box hidden" id="weatherErrorState">
    <p id="weatherErrorMsg">天気データの取得に失敗しました。通信環境を確認してください。</p>
    <div class="btn-row">
      <button class="btn" id="retryWeatherBtn" type="button">[ 再試行 ]</button>
    </div>
  </div>

  <!-- Main content -->
  <div id="mainContent" class="hidden">

    <div class="current">
      <div class="icon" id="currentIcon"></div>
      <div class="temp"><span id="currentTemp">--</span><span class="unit">°C</span></div>
      <div class="desc" id="currentDesc">--</div>
      <div class="stats-row">
        <div class="stat"><div class="label">体感</div><div class="value" id="statFeels">--°</div></div>
        <div class="stat"><div class="label">湿度</div><div class="value" id="statHumidity">--%</div></div>
        <div class="stat"><div class="label">風</div><div class="value" id="statWind">--</div></div>
      </div>
    </div>

    <div class="section-title">24H TRACE</div>
    <div class="trace-scroll"><svg id="traceSvg" width="720" height="220" viewBox="0 0 720 220"></svg></div>
    <div class="trace-legend">
      <span><span class="swatch" style="background:var(--amber)"></span>気温</span>
      <span><span class="swatch" style="background:var(--teal)"></span>降水確率</span>
    </div>

    <div class="section-title">7-DAY LOG</div>
    <div class="day-log" id="dayLog"></div>

    <footer>
      <p>Data: JMA / GFS ほか数値予報モデル（via Open-Meteo）</p>
      <button class="btn" id="manualRefreshBtn" type="button">[ 更新する ]</button>
    </footer>

  </div>

</div>

<script>
(function(){
  "use strict";

  var state = { lat:null, lon:null, accuracy:null, placeName:'', weather:null, refreshTimer:null };

  var WMO = {
    0:{d:'快晴',i:'clear'}, 1:{d:'ほぼ晴れ',i:'clear'}, 2:{d:'晴れ時々くもり',i:'cloudy'}, 3:{d:'くもり',i:'overcast'},
    45:{d:'霧',i:'fog'}, 48:{d:'霧氷',i:'fog'},
    51:{d:'弱い霧雨',i:'drizzle'}, 53:{d:'霧雨',i:'drizzle'}, 55:{d:'強い霧雨',i:'drizzle'},
    56:{d:'着氷性の霧雨',i:'drizzle'}, 57:{d:'強い着氷性の霧雨',i:'drizzle'},
    61:{d:'弱い雨',i:'rain'}, 63:{d:'雨',i:'rain'}, 65:{d:'強い雨',i:'rain'},
    66:{d:'着氷性の雨',i:'rain'}, 67:{d:'強い着氷性の雨',i:'rain'},
    71:{d:'弱い雪',i:'snow'}, 73:{d:'雪',i:'snow'}, 75:{d:'強い雪',i:'snow'}, 77:{d:'霧雪',i:'snow'},
    80:{d:'にわか雨',i:'rain'}, 81:{d:'強めのにわか雨',i:'rain'}, 82:{d:'激しいにわか雨',i:'rain'},
    85:{d:'にわか雪',i:'snow'}, 86:{d:'強いにわか雪',i:'snow'},
    95:{d:'雷雨',i:'thunder'}, 96:{d:'雷雨（ひょう）',i:'thunder'}, 99:{d:'雷雨（激しいひょう）',i:'thunder'}
  };
  function wmoInfo(code){ return WMO[code] || {d:'不明',i:'cloudy'}; }

  var COMPASS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
  function degToCompass(deg){ return COMPASS[Math.round(deg/22.5)%16]; }

  var WEEKDAY = ['日','月','火','水','木','金','土'];

  function iconSvg(kind, size){
    size = size || 48;
    var inner = '';
    var cloud = '<ellipse cx="17" cy="27" rx="7" ry="5.5"/><ellipse cx="25" cy="22" rx="10" ry="8"/><ellipse cx="33" cy="27" rx="7" ry="5.5"/><rect x="13" y="26" width="27" height="8" rx="4"/>';
    if(kind==='clear'){
      inner = '<circle cx="24" cy="24" r="8"/><line x1="24" y1="5" x2="24" y2="11"/><line x1="24" y1="37" x2="24" y2="43"/><line x1="5" y1="24" x2="11" y2="24"/><line x1="37" y1="24" x2="43" y2="24"/><line x1="10.5" y1="10.5" x2="14.6" y2="14.6"/><line x1="33.4" y1="33.4" x2="37.5" y2="37.5"/><line x1="37.5" y1="10.5" x2="33.4" y2="14.6"/><line x1="14.6" y1="33.4" x2="10.5" y2="37.5"/>';
    } else if(kind==='cloudy'){
      inner = '<circle cx="15" cy="14" r="5"/>' + cloud;
    } else if(kind==='overcast'){
      inner = cloud;
    } else if(kind==='fog'){
      inner = '<line x1="6" y1="18" x2="42" y2="18"/><line x1="10" y1="24" x2="38" y2="24"/><line x1="6" y1="30" x2="42" y2="30"/><line x1="12" y1="36" x2="36" y2="36"/>';
    } else if(kind==='drizzle'){
      inner = cloud + '<line x1="18" y1="37" x2="16" y2="42"/><line x1="25" y1="37" x2="23" y2="42"/><line x1="32" y1="37" x2="30" y2="42"/>';
    } else if(kind==='rain'){
      inner = cloud + '<line x1="17" y1="36" x2="14" y2="44"/><line x1="25" y1="36" x2="22" y2="44"/><line x1="33" y1="36" x2="30" y2="44"/>';
    } else if(kind==='snow'){
      inner = cloud + '<line x1="15" y1="38" x2="15" y2="44"/><line x1="12" y1="41" x2="18" y2="41"/><line x1="25" y1="38" x2="25" y2="44"/><line x1="22" y1="41" x2="28" y2="41"/><line x1="34" y1="38" x2="34" y2="44"/><line x1="31" y1="41" x2="37" y2="41"/>';
    } else if(kind==='thunder'){
      inner = cloud + '<polyline points="27,35 20,41 25,41 18,47"/>';
    } else {
      inner = cloud;
    }
    return '<svg viewBox="0 0 48 48" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
  }

  function $(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove('hidden'); }
  function hide(el){ el.classList.add('hidden'); }

  function setState(name){
    hide($('locatingState')); hide($('locationErrorState')); hide($('weatherErrorState')); hide($('mainContent'));
    if(name==='locating') show($('locatingState'));
    if(name==='locationError') show($('locationErrorState'));
    if(name==='weatherError') show($('weatherErrorState'));
    if(name==='ready') show($('mainContent'));
  }

  function fmtTime(d){
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return hh+':'+mm;
  }

  function parseLocalDateTime(str){
    // "2026-07-28T14:00" style, treated as local time by Date() natively
    return new Date(str);
  }

  function parseDateOnly(str){
    var parts = str.split('-');
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }

  function getPosition(){
    return new Promise(function(resolve, reject){
      if(!navigator.geolocation){ reject({code:0, message:'unsupported'}); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy:true, timeout:15000, maximumAge:0
      });
    });
  }

  function locationErrorMessage(err){
    if(err && err.code===1) return '位置情報の利用が許可されていません。ブラウザの設定で許可するか、下記に手動で座標を入力してください。';
    if(err && err.code===2) return '現在地を取得できませんでした。電波状況を確認するか、手動で座標を入力してください。';
    if(err && err.code===3) return '位置情報の取得がタイムアウトしました。再試行するか、手動で座標を入力してください。';
    return 'このブラウザでは位置情報を取得できません。下記に手動で座標を入力してください。';
  }

  async function reverseGeocode(lat, lon){
    try{
      var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=ja';
      var res = await fetch(url);
      if(!res.ok) throw new Error('geocode failed');
      var data = await res.json();
      return data.locality || data.city || data.principalSubdivision || data.countryName || '';
    }catch(e){
      return '';
    }
  }

  async function fetchWeather(lat, lon){
    var params = new URLSearchParams({
      latitude: lat.toFixed(4),
      longitude: lon.toFixed(4),
      current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day',
      hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset',
      timezone: 'auto',
      forecast_days: '7',
      wind_speed_unit: 'ms'
    });
    var res = await fetch('https://api.open-meteo.com/v1/forecast?'+params.toString());
    if(!res.ok) throw new Error('weather fetch failed');
    return res.json();
  }

  function renderReadout(){
    show($('readoutBox'));
    show($('relocateBtn'));
    $('latVal').textContent = Math.abs(state.lat).toFixed(4) + '°' + (state.lat>=0?'N':'S');
    $('lonVal').textContent = Math.abs(state.lon).toFixed(4) + '°' + (state.lon>=0?'E':'W');
    $('accuracyBadge').textContent = state.accuracy!=null ? ('±'+Math.round(state.accuracy)+'m') : '±--m';
    $('placeName').textContent = state.placeName || '地点名を取得できませんでした';
  }

  function renderCurrent(){
    var w = state.weather;
    var cur = w.current;
    var info = wmoInfo(cur.weather_code);
    $('currentIcon').innerHTML = iconSvg(info.i, 54);
    $('currentTemp').textContent = Math.round(cur.temperature_2m);
    $('currentDesc').textContent = info.d;
    $('statFeels').textContent = Math.round(cur.apparent_temperature) + '°';
    $('statHumidity').textContent = Math.round(cur.relative_humidity_2m) + '%';
    $('statWind').textContent = cur.wind_speed_10m.toFixed(1) + 'm/s ' + degToCompass(cur.wind_direction_10m);
    $('updatedAt').textContent = '更新 ' + fmtTime(new Date());
  }

  function renderTrace(){
    var w = state.weather;
    var times = w.hourly.time;
    var temps = w.hourly.temperature_2m;
    var pops = w.hourly.precipitation_probability;

    var now = new Date();
    var startIdx = 0;
    for(var i=0;i<times.length;i++){
      if(parseLocalDateTime(times[i]) >= now){ startIdx = i; break; }
    }
    var n = 24;
    var sliceTemps = temps.slice(startIdx, startIdx+n);
    var slicePops = pops.slice(startIdx, startIdx+n);
    var sliceTimes = times.slice(startIdx, startIdx+n);

    var colW = 30;
    var width = colW * sliceTemps.length;
    var svg = $('traceSvg');
    svg.setAttribute('width', width);
    svg.setAttribute('viewBox', '0 0 '+width+' 220');

    var tMax = Math.max.apply(null, sliceTemps);
    var tMin = Math.min.apply(null, sliceTemps);
    if(tMax - tMin < 2){ tMax += 1; tMin -= 1; }
    var padTop = 24, padBottom = 130;
    function mapY(t){
      return padBottom - ( (t - tMin) / (tMax - tMin) ) * (padBottom - padTop);
    }

    var parts = [];

    // grid lines (temp area)
    [padTop, (padTop+padBottom)/2, padBottom].forEach(function(y){
      parts.push('<line x1="0" y1="'+y+'" x2="'+width+'" y2="'+y+'" stroke="#D8E8F3" stroke-width="1" stroke-dasharray="2,3"/>');
    });

    // temp scale labels
    parts.push('<text x="4" y="'+(padTop-4)+'" font-family="IBM Plex Mono, monospace" font-size="10" fill="#4A5C70">'+Math.round(tMax)+'°</text>');
    parts.push('<text x="4" y="'+(padBottom+12)+'" font-family="IBM Plex Mono, monospace" font-size="10" fill="#4A5C70">'+Math.round(tMin)+'°</text>');

    // precip bars
    var barBase = 190, barArea = 30;
    for(var j=0;j<sliceTemps.length;j++){
      var pop = slicePops[j]==null ? 0 : slicePops[j];
      var bh = (pop/100)*barArea;
      var bx = j*colW + 6;
      parts.push('<rect x="'+bx+'" y="'+(barBase-bh)+'" width="'+(colW-12)+'" height="'+bh+'" fill="#08776C" opacity="0.55" rx="1"/>');
    }
    parts.push('<line x1="0" y1="'+barBase+'" x2="'+width+'" y2="'+barBase+'" stroke="#D8E8F3" stroke-width="1"/>');

    // temp polyline
    var pts = [];
    for(var k=0;k<sliceTemps.length;k++){
      var x = k*colW + colW/2;
      var y = mapY(sliceTemps[k]);
      pts.push(x+','+y);
    }
    parts.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="#B85E0A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    for(var m=0;m<pts.length;m++){
      var xy = pts[m].split(',');
      parts.push('<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="2" fill="#B85E0A"/>');
    }

    // now marker
    parts.push('<line x1="'+(colW/2)+'" y1="0" x2="'+(colW/2)+'" y2="'+barBase+'" stroke="#D6432F" stroke-width="1" stroke-dasharray="3,3"/>');

    // hour labels
    for(var h=0;h<sliceTimes.length;h++){
      var dt = parseLocalDateTime(sliceTimes[h]);
      if(dt.getHours() % 3 === 0){
        var lx = h*colW + colW/2;
        parts.push('<text x="'+lx+'" y="210" font-family="IBM Plex Mono, monospace" font-size="10" fill="#4A5C70" text-anchor="middle">'+String(dt.getHours()).padStart(2,'0')+'</text>');
      }
    }

    svg.innerHTML = parts.join('');
  }

  function renderDaily(){
    var w = state.weather;
    var d = w.daily;
    var rows = [];
    for(var i=0;i<d.time.length;i++){
      var info = wmoInfo(d.weather_code[i]);
      var dateObj = parseDateOnly(d.time[i]);
      var label = i===0 ? '今日' : (dateObj.getMonth()+1)+'/'+dateObj.getDate()+'('+WEEKDAY[dateObj.getDay()]+')';
      rows.push(
        '<div class="day-row">'+
          '<div class="date">'+label+'</div>'+
          '<div class="icon">'+iconSvg(info.i,22)+'</div>'+
          '<div><div class="desc">'+info.d+'</div><span class="pop">☂ '+Math.round(d.precipitation_probability_max[i])+'%</span></div>'+
          '<div class="temps"><span class="hi">'+Math.round(d.temperature_2m_max[i])+'°</span><span class="lo">'+Math.round(d.temperature_2m_min[i])+'°</span></div>'+
        '</div>'
      );
    }
    $('dayLog').innerHTML = rows.join('');
  }

  function renderAll(){
    renderReadout();
    renderCurrent();
    renderTrace();
    renderDaily();
    setState('ready');
  }

  async function loadWeather(){
    try{
      var weather = await fetchWeather(state.lat, state.lon);
      state.weather = weather;
      renderAll();
    }catch(e){
      renderReadout();
      setState('weatherError');
    }
  }

  async function loadPlaceAndWeather(){
    renderReadout();
    reverseGeocode(state.lat, state.lon).then(function(name){
      state.placeName = name;
      $('placeName').textContent = name || '地点名を取得できませんでした';
    });
    await loadWeather();
  }

  function startAutoRefresh(){
    if(state.refreshTimer) clearInterval(state.refreshTimer);
    state.refreshTimer = setInterval(function(){
      if(state.lat!=null && state.lon!=null) loadWeather();
    }, 15*60*1000);
  }

  async function locate(){
    setState('locating');
    hide($('readoutBox'));
    try{
      var pos = await getPosition();
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      state.accuracy = pos.coords.accuracy;
      await loadPlaceAndWeather();
      startAutoRefresh();
    }catch(err){
      $('locationErrorMsg').textContent = locationErrorMessage(err);
      setState('locationError');
    }
  }

  function useManualCoords(lat, lon){
    state.lat = lat;
    state.lon = lon;
    state.accuracy = null;
    setState('locating');
    loadPlaceAndWeather().then(startAutoRefresh);
  }

  // wire up events
  $('relocateBtn').addEventListener('click', locate);
  $('retryLocationBtn').addEventListener('click', locate);
  $('retryWeatherBtn').addEventListener('click', loadWeather);
  $('manualRefreshBtn').addEventListener('click', loadWeather);
  $('manualToggleBtn').addEventListener('click', function(){
    $('manualForm').classList.toggle('hidden');
  });
  $('manualSubmitBtn').addEventListener('click', function(){
    var lat = parseFloat($('manualLat').value);
    var lon = parseFloat($('manualLon').value);
    if(isNaN(lat) || isNaN(lon) || lat<-90 || lat>90 || lon<-180 || lon>180){
      alert('緯度・経度を正しく入力してください（緯度: -90〜90 / 経度: -180〜180）');
      return;
    }
    useManualCoords(lat, lon);
  });

  locate();
})();
</script>
</body>
</html>
